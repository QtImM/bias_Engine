<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bias Engine — 市场偏见控制台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loading">
    <div class="loading-text">正在初始化偏见引擎...</div>
  </div>

  <main class="shell">
    <!-- 1. 顶部状态栏 -->
    <header class="topbar" id="topbar"></header>

    <!-- 2. 最强信号摘要 -->
    <section id="heroSummary" class="hero-summary stagger-1"></section>

    <!-- 3. 偏见矩阵 -->
    <section class="stagger-2">
      <div class="section-title">偏见矩阵 — 日线 / 周线 / 月线</div>
      <div id="biasMatrix"></div>
    </section>

    <!-- 4. 多周期冲突分析 -->
    <section class="stagger-3">
      <div class="section-title">多周期冲突分析</div>
      <div class="conflict-board" id="conflictBoard"></div>
    </section>

    <!-- 5. 数据质量面板 -->
    <section class="stagger-4">
      <div class="section-title">数据新鲜度与质量</div>
      <div class="quality-board" id="qualityBoard"></div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
      <p>Bias Engine v1.0 · 多时间框架市场偏见研究系统</p>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
