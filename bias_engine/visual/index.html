<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bias Engine — Market Regime Console</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loading-text">INITIALIZING BIAS ENGINE...</div>
  </div>

  <main class="shell">
    <!-- 1. Topbar -->
    <header class="topbar" id="topbar"></header>

    <!-- 2. Bias Matrix -->
    <section class="stagger-1">
      <div class="section-title">Bias Matrix — D1 / W1 / M1</div>
      <div id="bias-matrix"></div>
    </section>

    <!-- 3. Conflict Board -->
    <section class="stagger-2">
      <div class="section-title">Multi-Horizon Conflict Analysis</div>
      <div class="conflict-board" id="conflict-board"></div>
    </section>

    <!-- 4. Factor Board -->
    <section class="stagger-3">
      <div class="section-title">Factor Contributions — Top Drivers</div>
      <div class="factor-board" id="factor-board"></div>
    </section>

    <!-- 5. Quality Board -->
    <section class="stagger-4">
      <div class="section-title">Data Freshness & Quality</div>
      <div class="quality-board" id="quality-board"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Bias Engine v1.0 &middot; Multi-Timeframe Market Bias Research System</p>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
